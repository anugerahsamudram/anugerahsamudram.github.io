<!DOCTYPE html>
<html lang="id">
<head>

  <title>Anugerah Samudra Maritim</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;

      color: #0a2540;
      background-color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;

    header {

      border-bottom: 1px solid #e2e8f0;

      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #0a2540;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: -0.02em;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3.25rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.2;
    }

    footer {
      padding: 24px 32px;
      border-top: 1px solid #e2e8f0;
      text-align: center;
      color: #64748b;
      font-size: 0.875rem;
    }

  <header>
    <a href="#" class="brand">
